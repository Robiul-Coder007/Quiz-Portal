{% extends 'base.html' %}

{% block content %}
<div>
    <h3>{{ page }}</h3>
    <p>Logged in as: {{ request.user.username }}<br>Protect your account by inputting a strong new password</p>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <div>
            <button type="submit">Update Password</button>
        </div>
    </form>
    <hr>
    <div>
        <p>Want to change your mind? <a href="{% url 'dashboard' %}">Back to Dashboard</a></p>
    </div>
</div>
{% endblock %}
