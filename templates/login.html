{% extends 'base.html' %}

{% block content %}
<div>
    <h3>Welcome Back</h3>
    <p>Log in to your Quiz Portal account</p>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <div>
            <button type="submit">Login</button>
        </div>
    </form>
    <hr>
    <div>
        <p>Don't have an account yet? <a href="{% url 'register' %}">Register Here</a></p>
    </div>
</div>
{% endblock %}
