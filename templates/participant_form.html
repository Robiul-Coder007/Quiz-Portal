{% extends 'base.html' %}

{% block content %}
<div>
    <h3>{{ page }}</h3>
    <p>Please complete or update your participant profile details</p>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <div>
            <button type="submit">Save Profile</button>
        </div>
    </form>
    <hr>
    <div>
        <p>Want to go back? <a href="{% url 'dashboard' %}">Back to Dashboard</a></p>
    </div>
</div>
{% endblock %}
